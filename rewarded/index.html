<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>App 激励视频 ADX · 实时演示</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Microsoft YaHei',system-ui,sans-serif;background:#0b1220;color:#e5e7eb}
  header{padding:20px 24px;border-bottom:1px solid #1f2937}
  h1{font-size:20px;margin:0 0 6px}
  header p{margin:0;color:#94a3b8;font-size:13px}
  .cols{display:flex;gap:20px;padding:20px 24px;flex-wrap:wrap}
  .phone{width:340px;background:#111827;border:10px solid #374151;border-radius:32px;padding:12px;min-height:520px}
  .screen{text-align:center}
  .game-title{font-size:16px;font-weight:700;margin-top:28px}
  .fail{color:#f87171;font-size:15px;margin:10px 0 18px}
  button{background:#f59e0b;color:#111827;border:0;border-radius:8px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .tip{color:#64748b;font-size:12px;margin-top:10px}
  .slot{margin-top:16px;min-height:80px}
  .reward{margin-top:14px;background:#065f46;color:#ecfdf5;border-radius:8px;padding:12px;font-size:14px}
  .log{flex:1;min-width:380px;background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px}
  .log h3{margin:0 0 10px;font-size:15px}
  ol{margin:0;padding-left:20px;font-size:13px;line-height:2}
  li{color:#64748b}
  li.done{color:#34d399}
  li.active{color:#fbbf24}
  pre{background:#0b1220;border:1px solid #1f2937;border-radius:8px;padding:10px;font-size:11px;max-height:200px;overflow:auto;white-space:pre-wrap;color:#a5b4fc}
</style>
</head>
<body>
<header>
  <h1>App 激励视频 ADX · 实时演示</h1>
  <p>链路：App 触发奖励点 → ADX 竞价 → 视频创意 → 曝光播放 → <b>完播</b> → 发放奖励 → 转化回传 → 预算扣减</p>
</header>

<div class="cols">
  <!-- 模拟 App 界面 -->
  <div class="phone">
    <div class="screen">
      <div id="gameBox">
        <div class="game-title">方块消除 · 第 27 关</div>
        <p class="fail">挑战失败</p>
        <button id="watchBtn">🎬 看视频复活</button>
        <p class="tip">奖励：<span id="rwName">复活道具×1</span>（需看完视频）</p>
      </div>
      <div class="slot rw-slot" id="adSlot"
           data-base="https://calendar.dellai.xyz"
           data-site="dellai.xyz"
           data-kw="休闲游戏,激励视频,rewarded,消除"
           data-reward="复活道具×1"></div>
      <div class="reward" id="rewardBox" style="display:none">✅ 奖励已发放：<b id="rewardText"></b></div>
    </div>
  </div>

  <!-- ADX 实时链路日志 -->
  <div class="log">
    <h3>ADX 实时链路</h3>
    <ol id="steps">
      <li data-step="0">App 触发奖励点（SDK.show）</li>
      <li data-step="1">ADX 竞价 /ssp/bid</li>
      <li data-step="2">返回胜出创意（VAST/video）</li>
      <li data-step="3">渲染播放 + 曝光计费</li>
      <li data-step="4">用户完播（ended）</li>
      <li data-step="5">发放奖励 + 转化回传 /api/track/conversion</li>
    </ol>
    <pre id="raw">等待触发…</pre>
  </div>
</div>

<script src="../rewarded_sdk.js"></script>
<script>
  var steps = document.querySelectorAll('#steps li');
  function mark(i, cls) {
    for (var k = 0; k < steps.length; k++) steps[k].className = '';
    for (var j = 0; j < i; j++) steps[j].className = 'done';
    if (steps[i]) steps[i].className = cls || 'active';
  }
  function log(obj) { document.getElementById('raw').textContent = JSON.stringify(obj, null, 2); }

  document.getElementById('watchBtn').onclick = function () {
    var slot = document.getElementById('adSlot');
    document.getElementById('rewardBox').style.display = 'none';
    slot.innerHTML = '';
    mark(1);

    RW_SDK.show(slot, {
      onRequest: function (req) { log({ bidRequest: req }); },
      onBid: function (ssp) {
        var b = ssp.seatbid && ssp.seatbid[0] && ssp.seatbid[0].bid && ssp.seatbid[0].bid[0];
        mark(2);
        if (b) {
          log({ bidResponse: { price: b.price, priceMicros: b.price * 1000000, cid: b.ext && b.ext.cid, admHasVideo: String(b.adm).indexOf('<video') >= 0 } });
          setTimeout(function () { mark(3); }, 200);
        } else {
          log({ bidResponse: ssp || 'NO_FILL' });
        }
      },
      onRender: function () { mark(3); },
      onStart: function () { mark(4); },
      onComplete: function (reward) {
        mark(6, 'done');
        document.getElementById('rewardText').textContent = reward;
        document.getElementById('rewardBox').style.display = 'block';
      },
      onSkip: function () { if (document.getElementById('rewardBox').style.display === 'none') { mark(4, 'active'); } },
      onError: function (e) { log({ error: e }); }
    });
  };
</script>
</body>
</html>
