<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PUB_SDK 演示页 · 装了就有广告位</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:'Microsoft YaHei',sans-serif;max-width:680px;margin:32px auto;padding:0 16px;line-height:1.7;color:#1f2937}
  .ad-slot{border:1px dashed #94a3b8;border-radius:10px;padding:16px;margin:18px 0;min-height:64px;color:#64748b}
  .hint{color:#94a3b8;font-size:13px}
  code{background:#f1f5f9;padding:2px 6px;border-radius:4px}
  input,button{padding:10px;width:100%;box-sizing:border-box;font-size:15px}
  button{margin-top:8px;background:#16a085;color:#fff;border:0;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<h1>PUB_SDK 演示页</h1>
<p class="hint">这是给媒体站长的示例：下方广告位由 <code>pub_sdk.js</code> 自动填充，证明"一行引入就有广告位"。真实投放文案由你的 offer / 方向决定，不写在这一层。</p>

<!-- 多广告位：每个 data-kw 独立竞价 → 不同主题(软考/户外)的 campaign 各自填充 -->
<div class="ad-slot" data-floor="2.0" data-cat="social" data-kw="软考,高项,信息系统项目管理师,论文,案例分析,挣值分析,关键路径,软考高级,备考资料">广告位① 软考主题（加载中…）</div>
<div class="ad-slot" data-floor="2.0" data-cat="social" data-kw="户外,露营,登山,徒步,户外装备,户外攻略,户外社群,爬山,野营">广告位② 户外主题（加载中…）</div>

<p>媒体自己的留资表单（示例），提交时调用 <code>PUB_SDK.trackConversion</code> 回传：</p>
<form id="lead">
  <input id="contact" placeholder="邮箱/微信" required>
  <button type="submit">提交</button>
</form>

<!-- 免费资料领取（百度云）：点获取=记转化(conv_log)，再展示提取码 -->
<div id="baidu" style="margin:18px 0;padding:16px;border:1px solid #16a085;border-radius:10px">
  <h3>📦 免费资料领取（百度云）</h3>
  <p>点击下方按钮，系统记录后即展示提取码（免费）：</p>
  <button id="getCode" type="button">获取提取码</button>
  <div id="codeBox" style="display:none;margin-top:10px;line-height:2">
    百度云：<a id="baiduUrl" href="https://pan.baidu.com/s/你的分享链接" target="_blank" rel="noopener">点击打开</a><br>
    提取码：<code id="code">你的提取码</code>
  </div>
</div>

<!-- 安装 SDK：动态注入，按 URL ?utm_source= 区分渠道（用于分渠道 ROI 统计） -->
<script>
  (function () {
    var chan = new URLSearchParams(location.search).get('utm_source') || 'xhs';
    var s = document.createElement('script');
    s.src = './pub_sdk.js';
    s.dataset.base = 'https://calendar.dellai.xyz';
    s.dataset.site = 'dellai.xyz';
    s.dataset.kw = '软考,户外';
    s.dataset.chan = chan;
    document.head.appendChild(s);
  })();
</script>

<script>
document.getElementById('lead').onsubmit = async (e) => {
  e.preventDefault();
  var slot = document.querySelector('.ad-slot');
  await PUB_SDK.trackConversion(slot.dataset.cid, slot.dataset.imp);
  alert('已提交，转化已回传');
};
document.getElementById('getCode').onclick = async () => {
  var slot = document.querySelector('.ad-slot');
  await PUB_SDK.trackConversion(slot.dataset.cid, slot.dataset.imp); // 记转化，分渠道归因
  document.getElementById('codeBox').style.display = 'block';
  document.getElementById('getCode').textContent = '已领取 ✓';
};
</script>
</body>
</html>
